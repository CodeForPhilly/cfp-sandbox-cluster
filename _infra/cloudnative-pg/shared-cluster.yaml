apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-cluster
  namespace: cloudnative-pg
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgis:18-3-system-trixie
  storage:
    size: 20Gi

  managed:
    roles:
      - name: balancer
        login: true
        passwordSecret:
          name: balancer-db-credentials

  # Backups: WAL archiving + nightly base backups to Linode Object Storage via
  # the Barman Cloud plugin. See backups.yaml for the ObjectStore + schedule.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: linode-cnpg
