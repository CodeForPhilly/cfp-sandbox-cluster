apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-cluster
  namespace: cloudnative-pg
spec:
  instances: 2
  # Pinned by digest: the tag floats, which left sandbox and live on different
  # Postgres patch releases. Bump the digest deliberately, both clusters at once.
  imageName: ghcr.io/cloudnative-pg/postgis:18-3-system-trixie@sha256:a2b2fc7941fe97a27728ecb285df0b35f0341b63bef98a8e4328723a0417f828
  storage:
    size: 20Gi

  managed:
    roles:
      - name: balancer
        login: true
        passwordSecret:
          name: balancer-db-credentials

  # Backups: WAL archiving + nightly base backups to GCS (off-Linode) via
  # the Barman Cloud plugin. See backups.yaml for the ObjectStore + schedule.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: gcs-cnpg
