# Continuous WAL archiving + nightly base backups for shared-cluster, via the
# Barman Cloud plugin (the in-tree barmanObjectStore is removed in cnpg 1.31).
#
# Bucket: gs://cnpg-sandbox in GCP project openphl-1177 (us-east4) — deliberately
# OFF Linode, so backups survive the loss of the Linode account or region.
# Barman keys everything under the Cluster's name inside the bucket, so any
# future Cluster on this k8s cluster can share it. The service account
# cnpg-backup-sandbox@openphl-1177 has objectAdmin + legacyBucketReader on this
# one bucket only; its JSON key is sealed in cloudnative-pg.secrets/.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: gcs-cnpg
  namespace: cloudnative-pg
spec:
  configuration:
    destinationPath: gs://cnpg-sandbox/
    googleCredentials:
      applicationCredentials:
        name: cnpg-backup-creds
        key: gcsCredentials
    wal:
      compression: gzip
    data:
      compression: gzip
  # Base backups and WALs older than this are pruned after each new backup.
  retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: shared-cluster-nightly
  namespace: cloudnative-pg
spec:
  # Six-field cron (seconds first): daily at 04:00 UTC / midnight Eastern.
  schedule: "0 0 4 * * *"
  # Take one as soon as this lands so the store is proven before we rely on it.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: shared-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
