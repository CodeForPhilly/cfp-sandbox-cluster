[hololens]
container = "ghcr.io/hologit/lenses/helm3:latest"

[hololens.input]
root = "_infra/cloudnative-pg/operator"
files = "**"

[hololens.output]
merge = "replace"

[hololens.helm]
namespace = "cloudnative-pg"
release_name = "cloudnative-pg"
include_crds = true
# The helm3 lens renders against 1.22 by default; chart >=0.29 declares
# kubeVersion >=1.29. Match the cluster (LKE 1.34).
kube_version = "1.34"
